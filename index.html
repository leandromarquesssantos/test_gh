<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="container">
            <h1>Todo List App</h1>
            <div class="card">
                <h2>Login</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <input type="checkbox" id="remember-me" name="remember-me">
                        <label for="remember-me">Remember me</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                    <button type="button" id="register-btn" class="btn btn-secondary">Register</button>
                </form>
                <div id="login-error" class="error-message"></div>
            </div>
        </div>
    </div>

    <!-- Todo List Screen -->
    <div id="todo-screen" class="screen hidden">
        <div class="container">
            <div class="header">
                <h1>My Todo List</h1>
                <div class="user-info">
                    <span id="current-user"></span>
                    <button id="logout-btn" class="btn btn-secondary">Logout</button>
                </div>
            </div>
            
            <div class="card">
                <h2>Add New Task</h2>
                <form id="todo-form">
                    <div class="form-group">
                        <input type="text" id="todo-title" placeholder="Task title" required>
                    </div>
                    <div class="form-group">
                        <textarea id="todo-description" placeholder="Task description (optional)" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Task</button>
                    <button type="button" id="cancel-edit-btn" class="btn btn-secondary hidden">Cancel</button>
                </form>
            </div>

            <div class="card">
                <h2>Tasks</h2>
                <div id="todo-list"></div>
                <div id="no-tasks-message" class="no-tasks hidden">No tasks yet. Add your first task above!</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
